  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SverigeAtlas ’74</title>
  <meta name="theme-color" content="#f3c969">
  <meta name="apple-mobile-web-app-title" content="SverigeAtlas">
  <link rel="manifest" href="./manifest.webmanifest">

  <style>
    :root {
      /* 70-talets jord- och pastellpalett */
      --bg-cream: #f4ebd9;
      --card-cream: #fff9ed;
      --border-dark: #2d231e;
      --mustard: #f3c969;
      --terracotta: #e78b6a;
      --sage: #8fa882;
      --teal: #6b9e9f;
      --brown-text: #2d231e;
      --paper-shadow: 3px 3px 0px var(--border-dark);
      --paper-shadow-sm: 2px 2px 0px var(--border-dark);
      --paper-shadow-pressed: 1px 1px 0px var(--border-dark);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Courier Prime', 'Courier New', monospace;
      background-color: var(--bg-cream);
      color: var(--brown-text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* 70-tals regnbågsrand (Supergraphics) */
    .retro-stripe {
      display: flex;
      height: 6px;
      width: 100%;
      flex-shrink: 0;
    }
    .retro-stripe div { flex: 1; }
    .stripe-1 { background-color: var(--terracotta); }
    .stripe-2 { background-color: var(--mustard); }
    .stripe-3 { background-color: var(--sage); }
    .stripe-4 { background-color: var(--teal); }

    /* Toppmeny */
    header {
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--mustard);
      border-bottom: 3px solid var(--border-dark);
      flex-shrink: 0;
    }

    .brand {
      font-family: 'VT323', monospace;
      font-size: 1.55rem;
      letter-spacing: 0.05em;
      color: var(--border-dark);
      text-transform: uppercase;
      line-height: 1;
    }

    .stats-group {
      display: flex;
      gap: 6px;
    }

    .retro-badge {
      background: var(--card-cream);
      border: 2px solid var(--border-dark);
      box-shadow: var(--paper-shadow-sm);
      padding: 2px 8px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    /* Norr om Stockholm - Switchpanel */
    .filter-bar {
      background: #edd8be;
      border-bottom: 3px solid var(--border-dark);
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .switch-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    /* Retro Pixel Toggle */
    .pixel-switch {
      position: relative;
      width: 44px;
      height: 22px;
      background: #cbb499;
      border: 2px solid var(--border-dark);
      box-shadow: inset 2px 2px 0px rgba(0,0,0,0.2);
    }

    .pixel-slider {
      position: absolute;
      top: 1px;
      left: 1px;
      width: 16px;
      height: 16px;
      background: var(--card-cream);
      border: 2px solid var(--border-dark);
      box-shadow: 1px 1px 0px rgba(0,0,0,0.3);
      transition: transform 0.15s steps(3);
    }

    .pixel-switch.active {
      background: var(--sage);
    }

    .pixel-switch.active .pixel-slider {
      transform: translateX(22px);
      background: var(--mustard);
    }

    /* Fliknavigering */
    nav {
      display: flex;
      background: var(--bg-cream);
      border-bottom: 3px solid var(--border-dark);
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 2px;
      border: none;
      background: transparent;
      color: var(--brown-text);
      font-family: 'Courier Prime', monospace;
      font-size: 0.72rem;
      font-weight: 700;
      text-align: center;
      border-right: 2px solid var(--border-dark);
      border-bottom: 3px solid transparent;
      cursor: pointer;
    }

    .tab-btn:last-child {
      border-right: none;
    }

    .tab-btn.active {
      background-color: var(--card-cream);
      border-bottom: 3px solid var(--terracotta);
      color: var(--terracotta);
    }

    /* Huvudsektion */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Kartvy */
    #map-wrapper {
      flex: 1.1;
      min-height: 240px;
      position: relative;
      border-bottom: 3px solid var(--border-dark);
      background: #d8c6b2;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #ded0bc;
      /* 70-tals tryck- och atlasfilter */
      filter: sepia(0.35) contrast(1.1) brightness(0.96);
    }

    /* Retro Pixel Knappar */
    .recenter-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 999;
      background: var(--card-cream);
      border: 2px solid var(--border-dark);
      box-shadow: var(--paper-shadow);
      color: var(--brown-text);
      padding: 5px 8px;
      font-family: 'Courier Prime', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    .recenter-btn:active {
      transform: translate(2px, 2px);
      box-shadow: var(--paper-shadow-pressed);
    }

    /* Interaktionspanel */
    #interaction-panel {
      flex: 1.35;
      display: flex;
      flex-direction: column;
      padding: 10px 12px;
      background: var(--bg-cream);
      overflow-y: auto;
    }

    .question-prompt {
      font-size: 0.85rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
      line-height: 1.3;
      background: var(--card-cream);
      border: 2px solid var(--border-dark);
      box-shadow: var(--paper-shadow-sm);
      padding: 6px 8px;
    }

    .target-highlight {
      font-family: 'VT323', monospace;
      color: var(--terracotta);
      font-size: 1.35rem;
      letter-spacing: 0.05em;
      display: block;
      margin-top: 2px;
    }

    /* 6 svarsknappar med pixelart-känsla */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      flex: 1;
    }

    .opt-btn {
      background: var(--card-cream);
      color: var(--brown-text);
      border: 2px solid var(--border-dark);
      box-shadow: var(--paper-shadow);
      padding: 8px 4px;
      font-family: 'Courier Prime', monospace;
      font-size: 0.78rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      line-height: 1.15;
      border-radius: 0;
    }

    .opt-btn:active {
      transform: translate(2px, 2px);
      box-shadow: var(--paper-shadow-pressed);
    }

    .opt-btn.correct {
      background-color: var(--sage) !important;
      color: #fff !important;
      box-shadow: 2px 2px 0px #1a3821 !important;
    }

    .opt-btn.wrong {
      background-color: var(--terracotta) !important;
      color: #fff !important;
      opacity: 0.85;
    }

    /* Statistik- och faktabox */
    #stat-feedback {
      margin-top: 8px;
      padding: 8px 10px;
      font-size: 0.78rem;
      background: #edd8be;
      border: 2px dashed var(--border-dark);
      color: var(--brown-text);
      display: none;
      line-height: 1.35;
    }

    #stat-feedback strong {
      color: #9c3f1c;
    }

    #next-btn {
      margin-top: 8px;
      padding: 10px;
      background: var(--teal);
      color: #fff;
      border: 2px solid var(--border-dark);
      box-shadow: var(--paper-shadow);
      font-family: 'Courier Prime', monospace;
      font-size: 0.88rem;
      font-weight: 700;
      display: none;
      cursor: pointer;
      text-transform: uppercase;
    }

    #next-btn:active {
      transform: translate(2px, 2px);
      box-shadow: var(--paper-shadow-pressed);
    }

    /* 8-bitars pixel-markör (Pricken) */
    .pixel-marker {
      width: 22px;
      height: 22px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .marker-dot {
      width: 10px;
      height: 10px;
      background: #e78b6a;
      border: 2px solid var(--border-dark);
      box-shadow: 0 0 0 2px var(--mustard);
      z-index: 2;
    }

    .marker-box-pulse {
      position: absolute;
      width: 22px;
      height: 22px;
      border: 2px dashed var(--terracotta);
      animation: pixel-pulse 1.2s steps(2) infinite;
    }

    @keyframes pixel-pulse {
      0% { transform: scale(0.8) rotate(0deg); opacity: 1; }
      50% { transform: scale(1.6) rotate(45deg); opacity: 0.5; }
      100% { transform: scale(0.8) rotate(0deg); opacity: 1; }
    }

    /* Mobile layout: the document can scroll on small screens / large text. */
    body { height:auto; min-height:100vh; min-height:100dvh; overflow:auto; }
    main { flex:none; overflow:visible; }
    header { gap:8px; padding:10px 12px; }
    .brand { font-size:1.45rem; }

    .filter-bar { flex-wrap:wrap; gap:4px 10px; padding:2px 12px; }
    .switch-wrap { min-height:44px; border:0; background:none; font:inherit; color:inherit; }
    .tab-btn { min-height:48px; font-size:.7rem; }
    .tab-btn.active { color:#8b351b; }
    #map-wrapper { flex:none; height:34svh; min-height:190px; max-height:380px; }
    #interaction-panel { flex:none; overflow:visible; padding:10px 12px 20px; }
    .question-prompt { font-size:.78rem; margin-bottom:10px; }
    .target-highlight { color:#943b22; font-size:1.3rem; }
    .options-grid { flex:none; grid-auto-rows:minmax(48px,auto); gap:9px; }
    .opt-btn { min-height:48px; font-size:.86rem; padding:10px 6px; overflow-wrap:anywhere; }
    .opt-btn.correct,.opt-btn.wrong { color:#2d231e!important; }
    .opt-btn:disabled { opacity:1; cursor:default; }
    #next-btn { min-height:48px; color:#172f30; }
    .recenter-btn { min-height:44px; top:8px; right:8px; }
    .leaflet-control-attribution { font:9px/1.3 sans-serif!important; }
    #map-status { position:absolute; bottom:22px; left:8px; right:8px; z-index:800; background:#fff9ed; padding:6px; font:12px/1.4 sans-serif; }
    #map-status:empty { display:none; }
    .data-note { font-size:.65rem; line-height:1.5; margin-top:12px; color:#665449; }
    button { touch-action:manipulation; }
    button:focus-visible { outline:3px solid #275f70; outline-offset:3px; }
    @media(min-width:700px) { body { max-width:860px; margin:auto; } #map-wrapper { height:42svh; } }
    @media(max-width:350px) { .brand { font-size:1.15rem; } .tab-btn { font-size:.62rem; } }
    @media(prefers-reduced-motion:reduce) { .marker-box-pulse { animation:none; } }
  </style>
</head>

      { namn: "Lund", lan: "Skåne län", pop: 130000, lat: 55.704, lng: 13.191 },

      { namn: "Halmstad", lan: "Hallands län", pop: 105000, lat: 56.674, lng: 12.857 },
      { namn: "Växjö", lan: "Kronobergs län", pop: 97000, lat: 56.877, lng: 14.809 },

      { namn: "Kalmar", lan: "Kalmar län", pop: 72000, lat: 56.663, lng: 16.361 },
      { namn: "Karlskrona", lan: "Blekinge län", pop: 67000, lat: 56.161, lng: 15.586 },
      { namn: "Gotland (Visby)", lan: "Gotlands län", pop: 61000, lat: 57.634, lng: 18.294 }
    ];

    /* ==========================================================
       LEAFLET SETUP MED CARTO & RETRO-LINJER
    ========================================================== */
    let map = null;
    let dotMarker = null;
    let boundaryLayers = { lan: null, kommun: null, landskap: null };
    let currentActiveLayer = null;
    let boundaryRequest = 0;
    let currentZoom = 5.75;

    const GEOJSON_URLS = {
      lan: "https://raw.githubusercontent.com/okfse/sweden-geojson/master/swedish_regions.geojson",
      kommun: "https://raw.githubusercontent.com/okfse/sweden-geojson/master/swedish_municipalities.geojson",
      landskap: "https://raw.githubusercontent.com/perliedman/svenska-landskap/master/svenska-landskap-klippt.geo.json"
    };

    function initMap() {
      map = L.map("map", {
        zoomControl: false,
        attributionControl: true,
        zoomSnap: 0.25,
        minZoom: 4,
        maxZoom: 14
      }).setView([62.5, 16.0], 5);

      // Lägg till CARTO Voyager No-Labels med din API-nyckel
      L.tileLayer(CARTO_VOYAGER_URL, {
        maxZoom: 14,
        minZoom: 4,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
      }).on('tileerror', () => { document.getElementById('map-status').textContent = 'Kartbilder kunde inte hämtas. Kontrollera internet och ladda om.'; }).addTo(map);

      // Ladda neutrala administrativa gränser i retrobrunt
      loadBoundariesFor("lan");

      setTimeout(() => {
        if (map) map.invalidateSize();
      }, 150);
    }

    async function loadBoundariesFor(type) {
      const request = ++boundaryRequest;
      if (!map) return;
      if (currentActiveLayer && map) {
        map.removeLayer(currentActiveLayer);
      }

      if (boundaryLayers[type]) {
        currentActiveLayer = boundaryLayers[type];
        map.addLayer(currentActiveLayer);
        return;
      }

      try {
        const res = await fetch(GEOJSON_URLS[type]);
        if (!res.ok) throw new Error("Offline");
        const data = await res.json();

        const layer = L.geoJSON(data, {
          interactive: false,
          style: {
            color: (type === "kommun") ? "#705844" : "#4a3b2c",
            weight: (type === "kommun") ? 1.0 : 1.6,
            opacity: 0.65,
            fill: false
          }
        });

        boundaryLayers[type] = layer;
        if (request !== boundaryRequest) return;
        currentActiveLayer = layer;
        if (map) map.addLayer(layer);
      } catch (err) {
        // Fallback vid lokal offline-körning utan externa nätverksresurser
        if (request === boundaryRequest) document.getElementById('map-status').textContent = 'Gränser kunde inte laddas. Pricken visar fortfarande frågans plats.';
      }
    }

    function updateDotPosition(lat, lng, zoom) {
      currentZoom = zoom;
      if (!map) return;

      if (!dotMarker) {
        const dotHtml = `
          <div class="pixel-marker">
            <div class="marker-dot"></div>
            <div class="marker-box-pulse"></div>
          </div>
        `;
        const icon = L.divIcon({
          html: dotHtml,
          className: "",
          iconSize: [22, 22],
          iconAnchor: [11, 11]
        });
        dotMarker = L.marker([lat, lng], { icon: icon, interactive: false }).addTo(map);
      } else {
        dotMarker.setLatLng([lat, lng]);
      }

      map.flyTo([lat, lng], zoom, { animate: !matchMedia("(prefers-reduced-motion: reduce)").matches, duration: 0.7 });
    }

    function centerOnDot() {
      if (currentTarget && map) {
        const z = currentZoom;
        map.flyTo([currentTarget.lat, currentTarget.lng], z, { animate: !matchMedia("(prefers-reduced-motion: reduce)").matches, duration: 0.4 });
      }
    }

    /* ==========================================================
       QUIZMOTOR & NORR OM STOCKHOLM-FILTER
    ========================================================== */
    let isNorthOnly = false;
    let currentTab = "lan";
    let currentTarget = null;
    let score = 0;
    let round = 1;
    let locked = false;

    const NORTH_LAT = 59.55;
    const REGION_NAMES = ["Region Stockholm", "Region Uppsala", "Region Sörmland", "Region Östergötland", "Region Jönköpings län", "Region Kronoberg", "Region Kalmar län", "Region Gotland", "Region Blekinge", "Region Skåne", "Region Halland", "Västra Götalandsregionen", "Region Värmland", "Region Örebro län", "Region Västmanland", "Region Dalarna", "Region Gävleborg", "Region Västernorrland", "Region Jämtland Härjedalen", "Region Västerbotten", "Region Norrbotten"];
    const REGION_DATA = LAN_DATA.map((d,i) => ({...d, namn:REGION_NAMES[i], lan:d.namn}));
    const EXTRA_OPTIONS = {
      "Stockholms län": ["Täby","Nacka","Värmdö","Haninge","Huddinge","Botkyrka"],
      "Uppsala län": ["Tierp","Älvkarleby","Östhammar","Knivsta","Heby","Håbo"],
      "Östergötlands län": ["Norrköping","Motala","Mjölby","Vadstena","Finspång","Ydre"],
      "Jönköpings län": ["Eksjö","Nässjö","Vetlanda","Värnamo","Gislaved","Habo"],
      "Kronobergs län": ["Alvesta","Ljungby","Älmhult","Markaryd","Tingsryd","Lessebo"],
      "Kalmar län": ["Nybro","Emmaboda","Torsås","Mörbylånga","Borgholm","Oskarshamn"],
      "Blekinge län": ["Karlshamn","Ronneby","Sölvesborg","Olofström"],
      "Skåne län": ["Trelleborg","Ystad","Eslöv","Landskrona","Hässleholm","Kristianstad"],
      "Hallands län": ["Laholm","Hylte","Falkenberg","Varberg","Kungsbacka"],
      "Västra Götalands län": ["Mölndal","Partille","Kungälv","Alingsås","Skövde","Uddevalla"],
      "Värmlands län": ["Arvika","Säffle","Grums","Hagfors","Kil","Forshaga"],
      "Örebro län": ["Kumla","Hallsberg","Laxå","Lekeberg","Karlskoga","Nora"],
      "Västmanlands län": ["Köping","Arboga","Kungsör","Hallstahammar","Surahammar","Fagersta"],
      "Jämtlands län": ["Krokom","Strömsund","Berg","Bräcke","Ragunda"],
      "Västernorrlands län": ["Timrå","Ånge","Kramfors"],
      "Gävleborgs län": ["Ovanåker","Nordanstig","Söderhamn","Ockelbo","Hofors"]
    };
    function municipalNames(target) {
      return [...new Set([...KOMMUNER_BASE.filter(d=>d.lan===target.lan).map(d=>d.namn), ...(EXTRA_OPTIONS[target.lan] || [])])];
    }
    function shuffle(arr) {
      const a=[...arr];
      for(let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
      return a;
    }
    function saveProgress() {
      try { localStorage.setItem('atlas74', JSON.stringify({score,round,isNorthOnly,currentTab})); } catch {}
    }

    function toggleNorthOnly() {
      isNorthOnly = !isNorthOnly;
      document.getElementById('north-toggle-wrap').setAttribute('aria-checked', String(isNorthOnly));
      const sw = document.getElementById("north-switch");
      const label = document.getElementById("region-scope-label");

      if (isNorthOnly) {
        sw.classList.add("active");
        label.innerText = "OMRÅDE: NORR OM STHLM";
      } else {
        sw.classList.remove("active");
        label.innerText = "OMRÅDE: HELA SVERIGE";
      }
      setupQuestion();
    }

    function getFilteredPool(dataset) {
      if (!isNorthOnly) return dataset;
      const res = dataset.filter(i => i.lat >= NORTH_LAT);
      return res;
    }

    function formatNumber(n) {
      return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    }

    function getRandomDistractors(arr, count, excludeItem) {
      const filtered = arr.filter(i => i.namn !== excludeItem.namn);
      const shuffled = shuffle(filtered);
      return shuffled.slice(0, count);
    }

    function switchTab(tab, clickedBtn) {
      currentTab = tab;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      clickedBtn.classList.add("active");

      if (tab === "lan" || tab === "befolkning") {
        loadBoundariesFor("lan");
      } else if (tab === "kommun") {
        loadBoundariesFor("kommun");
      } else if (tab === "landskap") {
        loadBoundariesFor("landskap");
      }

      if (map) {
        setTimeout(() => map.invalidateSize(), 50);
      }
      setupQuestion();
    }

    function setupQuestion() {
      locked = false;
      saveProgress();
      document.getElementById("stat-feedback").style.display = "none";
      document.getElementById("next-btn").style.display = "none";

      let promptText = "";
      let correctText = "";
      let options = [];
      let zoomLevel = 6.8;

      if (currentTab === "lan") {
        const pool = getFilteredPool(LAN_DATA);
        currentTarget = pool[Math.floor(Math.random() * pool.length)];
        zoomLevel = 5.75;
        updateDotPosition(currentTarget.lat, currentTarget.lng, zoomLevel);

        promptText = `Pricken lokaliserar ett län:<br><span class="target-highlight">VILKET LÄN PEKAR PRICKEN PÅ?</span>`;
        correctText = currentTarget.namn;

        const distractors = getRandomDistractors(pool, 5, currentTarget).map(d => d.namn);
        options = shuffle([correctText, ...distractors]);

      } else if (currentTab === "landskap") {
        const pool = getFilteredPool(LANDSKAP_DATA);
        currentTarget = pool[Math.floor(Math.random() * pool.length)];
        zoomLevel = 5.75;
        updateDotPosition(currentTarget.lat, currentTarget.lng, zoomLevel);

        promptText = `Pricken markerar en historisk del:<br><span class="target-highlight">VILKET LANDSKAP ÄR DETTA?</span>`;
        correctText = currentTarget.namn;

        const distractors = getRandomDistractors(pool, 5, currentTarget).map(d => d.namn);
        options = shuffle([correctText, ...distractors]);

      } else if (currentTab === "kommun") {
        const pool = getFilteredPool(KOMMUNER_BASE).filter(d => municipalNames(d).length > 1);
        currentTarget = pool[Math.floor(Math.random() * pool.length)];
        zoomLevel = 7.25;
        updateDotPosition(currentTarget.lat, currentTarget.lng, zoomLevel);

        promptText = `Pricken pekar i ${currentTarget.lan}:<br><span class="target-highlight">VILKEN KOMMUN SÖKS?</span>`;
        correctText = currentTarget.namn;

        const distractors = shuffle(municipalNames(currentTarget).filter(n => n !== correctText)).slice(0,5);
        options = shuffle([correctText, ...distractors]);

      } else if (currentTab === "befolkning") {
        const pick = Math.random();
        let entityType = "";
        let dataset = [];

        if (pick < 0.5) {
          entityType = "regionen";
          dataset = getFilteredPool(REGION_DATA);
          zoomLevel = 5.75;
        } else {
          entityType = "kommunen";
          dataset = getFilteredPool(KOMMUNER_BASE);
          zoomLevel = 7.25;
        }

        loadBoundariesFor(entityType === 'kommunen' ? 'kommun' : 'lan');
        currentTarget = dataset[Math.floor(Math.random() * dataset.length)];
        updateDotPosition(currentTarget.lat, currentTarget.lng, zoomLevel);

        promptText = `Ungefär hur många invånare har ${entityType}:<br><span class="target-highlight">${currentTarget.namn.toUpperCase()}?</span>`;
        const step = currentTarget.pop < 10000 ? 100 : currentTarget.pop < 100000 ? 1000 : 10000;
        const rounded = Math.round(currentTarget.pop / step) * step;
        correctText = `${formatNumber(rounded)} inv.`;
        const popSet = new Set([rounded]);
        for (const m of shuffle([0.6,0.75,0.85,1.15,1.25,1.4,1.6])) {
          if(popSet.size === 6) break;
          popSet.add(Math.max(step, Math.round(rounded * m / step) * step));
        }
        options = shuffle([...popSet]).map(p => `${formatNumber(p)} inv.`);
      }

      document.getElementById("question-text").innerHTML = promptText;

      const container = document.getElementById("options-box");
      container.innerHTML = "";
      options.forEach(optText => {
        const btn = document.createElement("button");
        btn.className = "opt-btn";
        btn.innerText = optText;
        btn.onclick = () => submitAnswer(btn, optText, correctText);
        container.appendChild(btn);
      });
    }

    function submitAnswer(btn, chosen, correct) {
      if (locked) return;
      locked = true;

      const isRight = (chosen === correct);
      if (isRight) {
        btn.classList.add("correct");
        score += 10;
        document.getElementById("score-val").innerText = score;
      } else {
        btn.classList.add("wrong");
        document.querySelectorAll(".opt-btn").forEach(b => {
          if (b.innerText === correct) b.classList.add("correct");
        });
      }

      const feedback = document.getElementById("stat-feedback");
      let fact = "";

      if (currentTab === "befolkning") {
        fact = `<strong>UNGEFÄRLIG FOLKMÄNGD:</strong> ${currentTarget.namn} har cirka <strong>${formatNumber(currentTarget.pop)} invånare</strong>.`;
        if (currentTarget.info) fact += ` [${currentTarget.info}]`;
      } else if (currentTab === "lan") {
        fact = `<strong>${currentTarget.namn.toUpperCase()}:</strong> Folkmängd: <strong>${formatNumber(currentTarget.pop)} inv.</strong> (${currentTarget.info})`;
      } else if (currentTab === "landskap") {
        fact = `<strong>${currentTarget.namn.toUpperCase()}:</strong> Landsdel: <strong>${currentTarget.del}</strong> med ca <strong>${formatNumber(currentTarget.pop)} inv.</strong>`;
      } else {
        fact = `<strong>${currentTarget.namn.toUpperCase()} KOMMUN:</strong> Tillhör <strong>${currentTarget.lan}</strong> med ca <strong>${formatNumber(currentTarget.pop)} invånare</strong>.`;
      }

      document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
      saveProgress();
      feedback.innerHTML = (isRight ? '<strong>Rätt!</strong> ' : '<strong>Rätt svar: ' + correct + '.</strong> ') + fact;
      feedback.style.display = "block";
      document.getElementById("next-btn").style.display = "block";
    }

    function nextQuestion() {
      round++;
      document.getElementById("round-val").innerText = round;
      setupQuestion();
    }

    // Registrera klickhändelser stabilt utan 'event'-beroenden
    window.addEventListener("DOMContentLoaded", () => {
      try {
        const saved = JSON.parse(localStorage.getItem('atlas74') || 'null');
        if(saved) {
          score = Number.isFinite(saved.score) ? saved.score : 0;
          round = Number.isFinite(saved.round) ? saved.round : 1;
          isNorthOnly = !!saved.isNorthOnly;
          if(['lan','kommun','landskap','befolkning'].includes(saved.currentTab)) currentTab = saved.currentTab;
        }
      } catch {}
      document.getElementById('score-val').textContent = score;
      document.getElementById('round-val').textContent = round;
      document.getElementById('north-switch').classList.toggle('active',isNorthOnly);
      document.getElementById('north-toggle-wrap').setAttribute('aria-checked',String(isNorthOnly));
      document.getElementById('region-scope-label').textContent = isNorthOnly ? 'OMRÅDE: NORR OM STHLM' : 'OMRÅDE: HELA SVERIGE';
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===currentTab));
      if (typeof L !== 'undefined') {
        initMap();
        new ResizeObserver(()=>map.invalidateSize()).observe(document.getElementById('map-wrapper'));
        loadBoundariesFor(currentTab === 'befolkning' ? 'lan' : currentTab);
      } else document.getElementById('map-status').textContent='Kartan kunde inte laddas. Anslut till internet och ladda om appen.';
      if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(()=>{});

      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          switchTab(btn.getAttribute("data-tab"), btn);
        });
      });

      document.getElementById("north-toggle-wrap").addEventListener("click", toggleNorthOnly);
      document.getElementById("recenter-btn").addEventListener("click", centerOnDot);
      document.getElementById("next-btn").addEventListener("click", nextQuestion);

      setupQuestion();
    });
  </script>
